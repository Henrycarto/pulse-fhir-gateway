[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-fhir-gateway"
version = "0.1.0"
description = "Turns a pulse monitor's serial stream into FHIR R4 heart-rate Observations, delivered without loss or duplicates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Henry Mba" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8", "fhir.resources==8.3.0", "ruff>=0.6"]

[project.scripts]
pulse-fhir = "pulse_fhir.cli:main"

[tool.setuptools]
packages = ["pulse_fhir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running FHIR server at FHIR_BASE_URL"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pulse_fhir", "conftest"]
