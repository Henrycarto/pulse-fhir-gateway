name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest --junitxml=junit-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml

  hapi-integration:
    runs-on: ubuntu-latest
    services:
      hapi:
        image: hapiproject/hapi:v8.12.0-2
        ports: ["8080:8080"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Wait for HAPI FHIR
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/fhir/metadata > /dev/null && exit 0
            sleep 5
          done
          echo "HAPI FHIR did not start" && exit 1
      - run: pytest -m integration -v --junitxml=junit-integration.xml
        env:
          FHIR_BASE_URL: http://localhost:8080/fhir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml

  hl7-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e .
      - run: python scripts/make_examples.py
      - name: Check examples are up to date
        run: git diff --exit-code examples/
      - name: Official HL7 FHIR validator
        run: |
          curl -sSL -o validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/download/7.0.2/validator_cli.jar
          java -jar validator_cli.jar examples/*.json -version 4.0.1 -output validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hl7-validation
          path: validation.json

  traceability:
    # Every requirement must be implemented and verified by a test that passed in this run,
    # and every risk control must be verified. Evidence comes from both test jobs.
    needs: [unit, hapi-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true
      - uses: Henrycarto/medtrace@v0.1.0
        with:
          junit: "junit-*.xml"
          report: traceability.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability
          path: traceability.md
